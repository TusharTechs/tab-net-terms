<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">TAB: pay later, still paid</title>
  <style>
    .ink { stroke: #16181d; }
    .acc { stroke: #ff5a1f; }
    .coin { fill: #ff5a1f; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #eceef2; } }
  </style>
  <!-- A ledger card with a tab: the buyer's tab with the supplier. -->
  <path class="ink" fill="none" stroke-width="4.5" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"
        d="M9 23a6 6 0 0 1 6-6h10.6a4 4 0 0 1 3.1 1.5L32.5 23H49a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H15a6 6 0 0 1-6-6Z">
    <animate attributeName="stroke-dashoffset" from="100" to="0" begin="0s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </path>
  <!-- The payment arrives later... -->
  <circle class="coin" r="3.4" cx="0" cy="0" opacity="0">
    <animateMotion begin="0.55s" dur="0.75s" fill="freeze" calcMode="spline" keySplines="0.5 0 0.3 1" keyTimes="0;1"
                   path="M4 4 C 14 -4, 20 20, 22 38"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" begin="0.55s" dur="0.8s" fill="freeze"/>
  </circle>
  <!-- ...and lands as proof. -->
  <path class="acc" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"
        d="M22 38l7 7 14-15">
    <animate attributeName="stroke-dashoffset" from="100" to="0" begin="1.25s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1"/>
  </path>
</svg>
